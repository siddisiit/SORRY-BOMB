<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Heart Full of Sorry</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: radial-gradient(circle at center, #2b0918 0%, #120309 100%);
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .intro-card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 105, 135, 0.3);
      padding: 40px 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .intro-card.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.9);
    }
    h1 { color: #ff4d6d; margin-bottom: 12px; font-size: 2rem; }
    p { color: #ffd6e0; margin-bottom: 24px; line-height: 1.5; }
    button {
      background: #ff4d6d;
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1.1rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 20px rgba(255, 77, 109, 0.6);
      transition: transform 0.2s, background 0.2s;
    }
    button:hover { background: #ff758f; transform: scale(1.05); }
  </style>
</head>
<body>

  <div class="intro-card" id="introCard">
    <h1>I'm Really Sorry 🥺</h1>
    <p>Words aren't enough, so I wrote it a hundred times over. Tap below.</p>
    <button onclick="startHeartBomb()">Open My Heart</button>
  </div>

  <canvas id="heartCanvas"></canvas>

  <script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    let isAnimating = false;
    let beatPhase = 0;

    const colors = ['#ff4d6d', '#ff758f', '#ff8fa3', '#ffb3c1', '#ffffff', '#ff0a54'];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Parametric heart equation
    function getHeartPoint(t, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x: x * scale, y: y * scale };
    }

    function createHeartParticles() {
      particles = [];
      const baseScale = Math.min(width, height) / 42;
      const totalWords = 260; // Number of tiny "Sorry" words forming the heart

      for (let i = 0; i < totalWords; i++) {
        const t = (Math.PI * 2 * i) / totalWords;
        // Layer multiple concentric heart outlines for a thick, full heart
        const layerScale = baseScale * (0.35 + (i % 6) * 0.13);
        const target = getHeartPoint(t, layerScale);

        particles.push({
          // Start scattered randomly off-screen or across screen
          x: Math.random() * width,
          y: Math.random() * height,
          targetX: target.x,
          targetY: target.y,
          color: colors[Math.floor(Math.random() * colors.length)],
          fontSize: Math.floor(Math.random() * 6) + 10, // 10px to 15px tiny text
          speed: 0.03 + Math.random() * 0.04,
          angle: (Math.random() - 0.5) * 0.4
        });
      }
    }

    function startHeartBomb() {
      document.getElementById('introCard').classList.add('hidden');
      createHeartParticles();
      isAnimating = true;
      animate();
    }

    function animate() {
      if (!isAnimating) return;
      ctx.clearRect(0, 0, width, height);

      beatPhase += 0.05;
      // Subtle heartbeat pulse multiplier
      const pulse = 1 + Math.sin(beatPhase) * 0.04;

      const centerX = width / 2;
      const centerY = height / 2 - 10;

      particles.forEach(p => {
        const destX = centerX + p.targetX * pulse;
        const destY = centerY + p.targetY * pulse;

        // Smoothly fly toward target spot on the heart
        p.x += (destX - p.x) * p.speed;
        p.y += (destY - p.y) * p.speed;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.font = `bold ${p.fontSize}px 'Segoe UI', sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('Sorry', 0, 0);
        ctx.restore();
      });

      // Glowing main "I'M SORRY" text right inside the center of the heart
      ctx.save();
      ctx.shadowColor = '#ff4d6d';
      ctx.shadowBlur = 20;
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${Math.max(22, Math.min(width, height) / 18)}px 'Segoe UI', sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText("I'm So Sorry ❤️", centerX, centerY + 10);
      ctx.restore();

      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
